spring.application.name=CineReserve
spring.config.import=optional:classpath:application-secrets.yml

app.admin.password=${ADMIN_PASSWORD}

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/cinereserve?timezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool (Zero Stale 500 Errors + Low RAM)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:db/migration

# Server Configuration
server.port=8081

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Mail Configuration (REST API)
brevo.api.key=${BREVO_API_KEY}
spring.mail.username=${MAIL_USERNAME}

# Logging (INFO/WARN to save RAM and CPU)
logging.level.org.springframework.web=INFO
logging.level.org.apache.coyote.http11=INFO
logging.level.com.dipu=INFO

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
management.endpoints.web.exposure.include=health

# Stripe Configuration
stripe.api.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
